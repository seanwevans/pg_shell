name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pg_shell_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pg_shell_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      # The GitHub Pages demo in web/ runs this repository's SQL in the
      # browser, so it is tested alongside everything else. Building it also
      # lets tests/test_web_demo.py run instead of skipping.
      - name: Install demo build dependencies
        run: npm ci
        working-directory: web
      - name: Unit-test the browser executor
        run: npm test
        working-directory: web
      - name: Build the demo site
        run: node web/build.mjs

      - run: python -m pytest -q
