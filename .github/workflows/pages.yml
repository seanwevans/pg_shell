name: Pages

# Publishes the in-browser pg_shell instance in web/ to GitHub Pages. The site
# is assembled at build time from sql/ and html/vendor/, so the published demo
# always runs the SQL that is in the branch it was built from.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'sql/**'
      - 'html/vendor/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queued runs wait rather than cancelling a publish
# that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install build dependencies
        run: npm ci
        working-directory: web

      - name: Unit-test the browser executor
        run: npm test
        working-directory: web

      - name: Build the site
        run: node web/build.mjs

      - uses: actions/configure-pages@v5
        with:
          # Turn Pages on for the repository if an admin has not already.
          enablement: true

      # A repository whose Pages source is still "Deploy from a branch" keeps
      # serving that branch's Jekyll build, and actions/deploy-pages reports
      # success regardless: the workflow goes green while the live site never
      # changes. configure-pages only sets the source when it creates the site,
      # so an already-enabled repository has to be switched over explicitly.
      - name: Serve Pages from this workflow, not from a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_type=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build_type is currently: $source_type"
          if [ "$source_type" = workflow ]; then
            exit 0
          fi
          if gh api -X PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow; then
            echo "Switched the Pages source to GitHub Actions."
            exit 0
          fi
          echo "::error::Pages builds from a branch (build_type=$source_type), so this deployment will not be visible and the branch's Jekyll build keeps serving. Set Settings -> Pages -> Build and deployment -> Source to 'GitHub Actions', then re-run this workflow."
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
